services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: ./api
    ports:
      - "4000:4000"
    depends_on:
      - rabbitmq

  worker:
    build: ./worker
    depends_on:
      - rabbitmq
    environment:
      AWS_ACCESS_KEY_ID: "mlflow"
      AWS_SECRET_ACCESS_KEY: "mlflowpass"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      MLFLOW_S3_IGNORE_TLS: "true"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api


# TODO : This needs to eventually get away from hardcoded port numbers
  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: "mlflow"
      AWS_SECRET_ACCESS_KEY: "mlflowpass"
    entrypoint: [
      "mlflow", "server",
      "--backend-store-uri", "postgresql+psycopg2://mlflow:mlflow@postgres/mlflow",
      "--default-artifact-root", "s3://mlflow/",
      "-h", "0.0.0.0",
      "--port", "5000"
    ]
    depends_on:
      - postgres
      - minio-init

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "mlflow"
      MINIO_ROOT_PASSWORD: "mlflowpass"
    volumes:
      - "mlflow-minio:/data/minio"
    command: server /data/minio --console-address ":9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10 &&
      mc alias set myminio http://minio:9000 mlflow mlflowpass &&
      mc mb myminio/mlflow || true
      "

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "mlflow"
      POSTGRES_PASSWORD: "mlflow"
      POSTGRES_DB: "mlflow"
    volumes:
      - "mlflow-postgres:/var/lib/postgresql/data"

volumes:
  mlflow-postgres:
    driver: local
  mlflow-minio:
    driver: local
